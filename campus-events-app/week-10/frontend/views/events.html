<div class="page-header">
    <div>
        <h1 class="page-title">Events</h1>
        <p class="page-subtitle">Concerts, hackathons, sports and workshops on campus – register before seats run out.</p>
    </div>
    <button class="btn btn-primary admin-only" id="add-event-button">
        <i class="bi bi-plus-lg me-1"></i> Add event
    </button>
</div>

<!-- Filters (client side – no extra request) -->
<div class="card mb-4">
    <div class="card-body row g-2">
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="search" class="form-control" id="event-search" placeholder="Search by title, club or location...">
            </div>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="event-category-filter">
                <option value="">All categories</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="event-when-filter">
                <option value="upcoming">Upcoming</option>
                <option value="past">Past</option>
                <option value="">All</option>
            </select>
        </div>
    </div>
</div>

<!-- Rendered by EventsPage from GET /events -->
<div class="row g-3" id="event-list"></div>

<!-- Add / edit event modal (admin) -->
<div class="modal fade" id="event-modal" tabindex="-1" aria-labelledby="event-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <form class="modal-content" id="event-form" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="event-modal-title">Add event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="id">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="event-title">Title</label>
                        <input type="text" class="form-control" id="event-title" name="title">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="event-club">Organised by (club)</label>
                        <select class="form-select" id="event-club" name="club_id"></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="event-category">Category</label>
                        <select class="form-select" id="event-category" name="category_id"></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="event-location">Location</label>
                        <input type="text" class="form-control" id="event-location" name="location" placeholder="e.g. IBU Amphitheatre">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="event-city">City</label>
                        <input type="text" class="form-control" id="event-city" name="city" value="Sarajevo">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="event-starts-at">Starts at</label>
                        <input type="datetime-local" class="form-control" id="event-starts-at" name="starts_at">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="event-capacity">Capacity (seats)</label>
                        <input type="number" class="form-control" id="event-capacity" name="capacity" min="1">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="event-description">Description</label>
                        <textarea class="form-control" id="event-description" name="description" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save event</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete confirmation modal (admin) -->
<div class="modal fade" id="delete-event-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to delete <strong id="delete-event-name"></strong>? This cannot be undone.</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-event">Delete</button>
            </div>
        </div>
    </div>
</div>
