<div class="page-header">
    <div>
        <h1 class="page-title">Categories</h1>
        <p class="page-subtitle">Group events by interest.</p>
    </div>
    <button class="btn btn-primary admin-only" id="add-category-button">
        <i class="bi bi-plus-lg me-1"></i> Add category
    </button>
</div>

<!-- Rendered by DataTables from the API -->
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
        <table class="table table-hover w-100" id="categories-table"></table>
        </div>
    </div>
</div>

<!-- Add / edit modal -->
<div class="modal fade" id="category-modal" tabindex="-1" aria-labelledby="category-modal-title" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="category-form" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="category-modal-title">Add category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="id">
                <div class="mb-3">
                    <label class="form-label" for="category-name">Name</label>
                    <input type="text" class="form-control" id="category-name" name="name" >
                </div>
                <div class="mb-3">
                    <label class="form-label" for="category-description">Description</label>
                    <textarea class="form-control" id="category-description" name="description" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal fade" id="delete-category-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">Are you sure you want to delete <strong id="delete-category-name"></strong>?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-category">Delete</button>
            </div>
        </div>
    </div>
</div>
