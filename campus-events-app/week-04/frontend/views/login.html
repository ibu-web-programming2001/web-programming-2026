<div class="card auth-card">
    <div class="card-body">
        <div class="text-center mb-4">
            <img src="assets/img/logo.svg" class="auth-logo mb-3" alt="CampusEvents">
            <h1 class="h4 fw-bold mb-1">Welcome back</h1>
            <p class="text-muted mb-0">Log in to your CampusEvents account</p>
        </div>

        <form id="login-form" novalidate>
            <div class="mb-3">
                <label for="login-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="login-email" name="email" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="mb-4">
                <label for="login-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <!-- Week 1: static page – the button only navigates. Login is connected in week 10. -->
            <a href="#dashboard" class="btn btn-primary w-100 py-2">Log in</a>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
            Don't have an account? <a href="#register">Create one</a>
        </p>
    </div>
</div>
